name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Restrição inegociável 9: nada de segredos no repositório. Estas credenciais
  # são do serviço efémero do runner e morrem com o job.
  # 127.0.0.1 e não `localhost`: o Node resolve `localhost` para ::1 primeiro,
  # e o serviço do runner só escuta em IPv4. O driver acaba por tentar o IPv4 a
  # seguir, mas a primeira tentativa falha sempre — e quando falha de vez, o
  # erro que sai é `ECONNREFUSED ::1:5432`, que parece a base estar em baixo.
  DATABASE_URL: postgres://cvforms:cvforms@127.0.0.1:5432/cvforms
  KEYCLOAK_ISSUER: http://localhost:8080/realms/cvforms
  NEXTAUTH_SECRET: apenas-para-o-ci
  API_URL: http://localhost:4000

jobs:
  verificar:
    name: tipos, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Postgres levantado à mão, e não como `service`, por uma razão: um
      # serviço do runner não aceita argumentos de arranque, e este precisa de
      # `wal_level=logical`. Sem isso o PowerSync não replica e o teste do
      # vigia da F10.9 não tem como criar um slot — testaríamos contra uma
      # base configurada de maneira diferente da de produção, que é o género
      # de teste que passa e não prova nada.
      #
      # São os mesmos argumentos do `docker-compose.prod.yml`.
      - name: Postgres com PostGIS e decodificação lógica
        run: |
          docker run -d --name postgres             -e POSTGRES_USER=cvforms -e POSTGRES_PASSWORD=cvforms -e POSTGRES_DB=cvforms             -p 5432:5432 postgis/postgis:16-3.4             postgres -c wal_level=logical -c max_replication_slots=8 -c max_wal_senders=8
          for i in $(seq 1 60); do
            docker exec postgres pg_isready -U cvforms -d cvforms > /dev/null 2>&1 && break
            sleep 2
          done
          docker exec postgres psql -U cvforms -d cvforms -tAc 'SHOW wal_level'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Migrações contra um PostGIS a sério
        run: pnpm db:migrate

      - name: O JSON Schema publicado está sincronizado com a fonte
        run: pnpm --filter @cvforms/form-core schema:check

      - name: Tipos, testes e build
        run: pnpm turbo run typecheck test build

  restricoes:
    name: restrições inegociáveis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # As restrições do ESPECIFICACAO.md §8 que se podem verificar por leitura
      # do código são verificadas aqui. As outras têm testes.
      #
      # Isto existe porque uma restrição que só vive num documento acaba por
      # ser violada por alguém que não leu o documento — e o momento de dar por
      # isso é agora, não no teste de campo.
      - name: Nada de eval na avaliação de expressões (restrição 7)
        run: |
          if grep -rnE '\beval\(|new Function\(' \
               --include='*.ts' --include='*.tsx' \
               apps packages infra --exclude-dir=node_modules --exclude-dir=dist; then
            echo "::error::encontrei eval ou Function() — ver ESPECIFICACAO.md §8, restrição 7"
            exit 1
          fi

      - name: Nada de mosaicos do Google guardados para offline (restrição 1)
        run: |
          if grep -rniE 'maps\.googleapis\.com/.*(tile|mbtiles|cache)|googleTile.*(cache|offline)' \
               --include='*.ts' --include='*.tsx' \
               apps packages --exclude-dir=node_modules --exclude-dir=dist; then
            echo "::error::mosaicos do Google não podem ser guardados — ver ESPECIFICACAO.md §8, restrição 1"
            exit 1
          fi

      - name: Nenhum código específico de um formulário (restrição 6)
        run: |
          # Um `if` sobre a chave de um formulário concreto é o sintoma de que a
          # plataforma deixou de ser plataforma.
          if grep -rnE "(form|formulario|form_key|formKey)\s*(===|==)\s*['\"](local_consumo|cadastro|posto_transformacao|inquerito)" \
               --include='*.ts' --include='*.tsx' \
               apps packages --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=test; then
            echo "::error::código específico de um formulário — ver ESPECIFICACAO.md §8, restrição 6"
            exit 1
          fi

      - name: Nenhum ficheiro .env commitado (restrição 9)
        run: |
          # Os ficheiros `*.example` são modelos SEM segredos e existem para
          # documentar o que é preciso preencher — `.env.example` e
          # `.env.producao.example`. O que não pode entrar é um `.env` a sério:
          # `.env`, `.env.local`, `.env.producao`.
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$'; then
            echo "::error::ficheiro .env no repositório — ver ESPECIFICACAO.md §8, restrição 9"
            exit 1
          fi
